name: P0 Security Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [security/p0-auth-rls-remediation]

permissions:
  contents: read

jobs:
  static-security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run static security regression tests
        run: bun run test:security
      - name: Run TypeScript checks
        run: bun run lint
      - name: Run production build
        run: bun run build
